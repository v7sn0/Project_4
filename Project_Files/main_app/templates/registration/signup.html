{% extends "base.html" %}

{% block content %}

  <div class="form-wrapper">
    <h1>Create Account</h1>
    <form method="POST">
      {% csrf_token %}
      {{form.as_p}}
      <button type="submit">Sign up</button>
    </form>
    <p style="margin-top: 16px; text-align: center; font-size: 13px; color: #888;">
      Already have an account? <a href="/auth/login" style="color: #1a3a6b;">Login</a>
    </p>
  </div>

{% endblock content %}
