{% extends "base.html" %}

{% block head %}{% endblock head %}

{% block content %}

  <form method="POST">
    {% csrf_token %}
    {{ form.non_field_errors }}

    {% for field in form %}
      <div>
        {{ field.label_tag }}
        {{ field }}
        {{ field.errors }}
      </div>

    {% endfor %}

    {% if form.instance.accept %}
      <button type="submit" disabled>Resolved</button>
    {% else %}
      <button type="submit">Resolve</button>
    {% endif %}
  </form>

{% endblock content %}
